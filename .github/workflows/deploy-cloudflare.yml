name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
      - "mail-vue/**"
  workflow_dispatch:

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: ⚙ Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 9

      - name: ⚙ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 📡 Disable wrangler telemetry
        working-directory: ./mail-worker
        run: pnpm wrangler telemetry disable

      - name: 🚀 Deploy
        working-directory: ./mail-worker
        run: |
          echo "🚀 Deploying cloud-mail to Cloudflare Workers..."
          pnpm wrangler deploy -c wrangler-action.toml 2>&1

      - name: ♻️ Initialize database
        run: |
          echo "🛠️ Initializing database..."
          sleep 15
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/response.txt "https://mail.ssvip.asia/api/init/lhb90311.")
          RESPONSE=$(cat /tmp/response.txt)
          if [ "$RESPONSE" = "success" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Database initialized."
          else
            echo "⚠️ Init response: $RESPONSE (HTTP: $HTTP_CODE)"
          fi
